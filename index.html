<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>校園生活大冒險：今天也不能倒下！(Campus & Home Life: English Quest)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fredoka:wght@500;600;700&family=Mali:wght@500;700&family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* Theme specific typography */
    body.theme-pixel {
      font-family: 'DotGothic16', 'Noto Sans TC', monospace;
      --accent: #f59e0b;
      --panel-bg: #141724;
      --border-color: #4338ca;
    }
    body.theme-storybook {
      font-family: 'Mali', 'Noto Sans TC', cursive;
      --accent: #f472b6;
      --panel-bg: #291b25;
      --border-color: #f472b6;
    }
    body.theme-anime {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      --accent: #38bdf8;
      --panel-bg: #0f172a;
      --border-color: #38bdf8;
    }
    body.theme-cyber {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      --accent: #00f3ff;
      --panel-bg: #050b14;
      --border-color: #00f3ff;
    }

    /* Microphone pulse glow */
    @keyframes micPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-live {
      animation: micPulse 1.3s infinite ease-out;
      background-color: #dc2626 !important;
      border-color: #fca5a5 !important;
    }

    /* Float text animation */
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-45px); opacity: 0; }
    }
    .anim-float {
      animation: floatUp 1.3s forwards ease-out;
    }
  </style>
</head>
<body class="theme-pixel bg-[#0b0e17] text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-amber-500 selection:text-black">

  <!-- Celebration Confetti Layer -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- TOP HUD BAR -->
  <header class="w-full bg-[#131929]/95 backdrop-blur border-b-2 border-slate-700/80 px-3 py-2 sticky top-0 z-40 shadow-xl">
    <div class="max-w-6xl mx-auto flex items-center justify-between flex-wrap gap-2">
      
      <!-- Brand & Time Info -->
      <div class="flex items-center space-x-3">
        <span class="text-2xl filter drop-shadow">🎒</span>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm md:text-base font-extrabold text-amber-300">今天也不能倒下！</h1>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-900/90 text-indigo-200 border border-indigo-500">國小 3-5 年級校園與生活</span>
          </div>
          <div class="text-[11px] text-slate-300 flex items-center gap-2 mt-0.5">
            <span>⏰ <strong id="clock-display" class="text-yellow-400 font-mono">08:30 AM</strong></span>
            <span>•</span>
            <span id="period-display" class="text-emerald-400 font-bold">晨間打掃與晨讀</span>
          </div>
        </div>
      </div>

      <!-- Character Status Pill & Stats -->
      <div class="flex items-center space-x-2 md:space-x-3 text-xs flex-wrap">
        <!-- Active Character Card -->
        <button onclick="openRosterModal()" class="flex items-center gap-1.5 bg-[#0a0d14] hover:bg-slate-800 border border-amber-500/60 px-2.5 py-1 rounded-xl transition active:scale-95 shadow">
          <span id="hud-char-avatar" class="text-base">🌟</span>
          <div class="text-left leading-tight">
            <div id="hud-char-name" class="font-bold text-amber-300 text-[11px]">小森老師</div>
            <div id="hud-char-trait" class="text-[9px] text-emerald-400">口說點數+1</div>
          </div>
          <span class="text-[10px] text-slate-400">▼換</span>
        </button>

        <!-- Stamina (HP) -->
        <div class="flex items-center space-x-1.5 bg-[#0a0d14] px-2.5 py-1 rounded-xl border border-slate-700">
          <span class="text-sm">⚡</span>
          <span class="text-slate-400 text-[11px]">體力:</span>
          <div class="w-16 md:w-20 bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-600">
            <div id="hp-bar" class="h-full bg-gradient-to-r from-red-500 via-amber-400 to-emerald-400 transition-all duration-300" style="width: 85%;"></div>
          </div>
          <span id="hp-val" class="text-slate-200 font-bold text-[11px]">85%</span>
        </div>

        <!-- Oral Points (Stars) -->
        <div class="flex items-center space-x-1 bg-[#0a0d14] px-2.5 py-1 rounded-xl border border-amber-500/50">
          <span class="text-yellow-400">⭐</span>
          <span id="stat-points" class="text-yellow-300 font-bold">4</span>
          <span class="text-[10px] text-yellow-500 font-semibold">pts</span>
        </div>

        <!-- Shop Button -->
        <button onclick="openShopModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-2.5 py-1 rounded-xl text-xs shadow flex items-center gap-1 transition active:scale-95">
          <span>🏪</span>
          <span>小舖</span>
        </button>

        <!-- Audio mute/unmute -->
        <button id="btn-sound-toggle" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl text-xs" title="音效開關">
          🔊
        </button>
      </div>
    </div>
  </header>

  <!-- ART STYLE SELECTOR -->
  <section class="max-w-6xl w-full mx-auto px-3 pt-2">
    <div class="bg-[#151c2e]/90 border border-slate-700/80 rounded-xl p-2 flex items-center justify-between flex-wrap gap-2">
